<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tính điểm trung bình</title>
<style>
body{font-family:Arial;background:#f0fdf4;display:grid;place-items:center;min-height:100vh;margin:0}
main{background:white;padding:28px;border-radius:16px;width:min(380px,88vw);box-shadow:0 8px 25px #0001}
h1{color:#166534;text-align:center;font-size:23px}label{display:block;margin-top:12px}
input,button{width:100%;padding:11px;box-sizing:border-box;margin-top:6px;border-radius:8px;font-size:16px}
input{border:1px solid #cbd5e1}button{background:#16a34a;color:white;border:0;cursor:pointer}
#result{line-height:1.6;font-weight:bold;color:#166534}
</style></head><body><main><h1>Xếp loại học tập</h1>
<label>Điểm Toán (hệ số 2)<input id="math" type="number" min="0" max="10" step="0.1"></label>
<label>Điểm Văn<input id="literature" type="number" min="0" max="10" step="0.1"></label>
<label>Điểm Anh<input id="english" type="number" min="0" max="10" step="0.1"></label>
<button onclick="calculateAverage()">Tính điểm</button><p id="result"></p></main>
<script>
function calculateAverage(){
 const ids=['math','literature','english'];
 const values=ids.map(id=>document.getElementById(id).value);
 const out=document.getElementById('result');
 if(values.some(v=>v==='')){out.textContent='Vui lòng nhập đầy đủ điểm.';return;}
 const scores=values.map(Number);
 if(scores.some(v=>v<0||v>10)){out.textContent='Điểm phải nằm trong khoảng 0 đến 10.';return;}
 const average=(scores[0]*2+scores[1]+scores[2])/4;
 let rank=average>=8?'Giỏi':average>=6.5?'Khá':average>=5?'Trung bình':'Cần cố gắng';
 out.textContent='Điểm trung bình: '+average.toFixed(2)+' — Xếp loại: '+rank;
}
</script></body></html>
